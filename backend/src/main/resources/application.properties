spring.application.name=atividade_ongs

# Porta do servidor. Em hospedagens na nuvem (como o Render), a porta vem da variável PORT.
server.port=${PORT:8080}

# ------------------------------------------------------------------
# PostgreSQL
# Crie o banco antes de subir a aplicação:
#   CREATE DATABASE atividade_ongs;
# Os valores abaixo podem ser sobrescritos por variáveis de ambiente.
# ------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/atividade_ongs}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

# Poucas conexões e renovação antes de o banco da nuvem (que dorme quando ocioso) derrubá-las.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.max-lifetime=240000

# ------------------------------------------------------------------
# JPA / Hibernate
# update = cria/atualiza as tabelas automaticamente a partir das entidades.
# Em produção troque para "validate" e use Flyway/Liquibase para migrações.
# ------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
# Mostra os comandos SQL no terminal. Na nuvem, use SHOW_SQL=false.
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

